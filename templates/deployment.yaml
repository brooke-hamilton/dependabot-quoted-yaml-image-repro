apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-buildkit
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: buildkit
          image: {{ .Values.buildkit.image | quote }}
          args:
            - --oci-worker-no-process-sandbox
          securityContext:
            runAsUser: 1000
